services:
  comfyui:
    image: uswccr.ccs.tencentyun.com/registry/facefusion-docker:latest
    container_name: comfyui
    restart: unless-stopped
    ports:
      - "8199:8188"
    environment:
      NVIDIA_VISIBLE_DEVICES: "4"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - /data/ComfyUI/models:/opt/ComfyUI/models
      - ./input:/opt/ComfyUI/input
      - ./output:/opt/ComfyUI/output
      - ./user:/opt/ComfyUI/user
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids:
                - "4"
              capabilities:
                - gpu
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8188/system_stats", timeout=5)
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
